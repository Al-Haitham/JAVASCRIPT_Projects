<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <h2 class="text-center">Formulaire d'inscription</h2>

        <form action="" id="formIn">
            <div class="d-flex flex-column gap-3 col-8 justify-content-center">
                
                <div>
                    <label for="nom">Nom</label>
                    <input type="text" id="nom" class="form-control">
                </div>
    
                <div>
                    <label for="prenom">Prenom</label>
                    <input type="text" id="prenom" class="form-control">
                </div>
    
                <div>
                    <label for="age">Age</label>
                    <input type="number" id="age" class="form-control">
                </div>
    
                <div class="row d-flex">
                    <label for="filier">Filier</label>
                    <select name="filier" id="filier">
                        <option value="" disabled selected>--Selectionnez un filier</option>
                        <option value="info">Info</option>
                        <option value="physique">Physique</option>
                        <option value="math">Math</option>
                    </select>
                </div>
    
                <div class="row">
                    <label>Ecole</label>
                    <div>
                        <input type="radio" name="ecole" id="ensa" value="ensa">ENSA
                        <input type="radio" name="ecole" id="enset" value="enset">ENSET
                        <input type="radio" name="ecole" id="ensam" value="ensam">ENSAM
                    </div>
                    <div>
                        <input type="radio" name="ecole" id="inpt" value="inpt">INPT
                        <input type="radio" name="ecole" id="ensias" value="ensias">ENSIAS
                        <input type="radio" name="ecole" id="insea" value="insea">INSEA
                    </div>
                </div>
    
                <div class="row d-flex">
                    <label for="lang">Languages</label>
                    <select name="langs[]" id="lang" multiple>
                        <option value="" disabled selected>--Selectionnez les languages</option>
                        <option value="ar">Arab</option>
                        <option value="en">Anglais</option>
                        <option value="zh">Chinois</option>
                        <option value="fr">Fransais</option>
                    </select>
                </div>
    
                <div>
                    <label for="skills">Competences</label>
                    <input type="checkbox" id="cpp" value="cpp">C++
                    <input type="checkbox" id="py" value="py">Python
                    <input type="checkbox" id="cs" value="cs">C#
                    <input type="checkbox" id="sql" value="sql">SQL
                </div>
            
            <button class="btn btn-primary">Envoyer</button>
            </div>
        </form>
    </div>
</body>
</html>
