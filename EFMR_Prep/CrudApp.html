<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <h2 class="text-center">Formulaire d'inscription</h2>

        <form action="" id="formIn">
            <div class="d-flex flex-column gap-3 col-8 justify-content-center">
                
                <div>
                    <label for="nom">Nom</label>
                    <input type="text" id="nom" class="form-control">
                </div>
    
                <div>
                    <label for="prenom">Prenom</label>
                    <input type="text" id="prenom" class="form-control">
                </div>
    
                <div>
                    <label for="age">Age</label>
                    <input type="number" id="age" class="form-control">
                </div>
    
                <div class="row d-flex">
                    <label for="filier">Filier</label>
                    <select name="filier" id="filier">
                        <option value="" disabled selected>--Selectionnez un filier</option>
                        <option value="info">Info</option>
                        <option value="physique">Physique</option>
                        <option value="math">Math</option>
                    </select>
                </div>
    
                <div class="row">
                    <label>Ecole</label>
                    <div>
                        <input type="radio" name="ecole" id="ensa" value="ensa">ENSA
                        <input type="radio" name="ecole" id="enset" value="enset">ENSET
                        <input type="radio" name="ecole" id="ensam" value="ensam">ENSAM
                    </div>
                    <div>
                        <input type="radio" name="ecole" id="inpt" value="inpt">INPT
                        <input type="radio" name="ecole" id="ensias" value="ensias">ENSIAS
                        <input type="radio" name="ecole" id="insea" value="insea">INSEA
                    </div>
                </div>
    
                <div class="row d-flex">
                    <label for="lang">Languages</label>
                    <select name="langs[]" id="lang" multiple>
                        <option value="" disabled selected>--Selectionnez les languages</option>
                        <option value="ar">Arab</option>
                        <option value="en">Anglais</option>
                        <option value="zh">Chinois</option>
                        <option value="fr">Fransais</option>
                    </select>
                </div>
    
                <div>
                    <label for="skills">Competences</label>
                    <input type="checkbox" id="cpp" value="cpp">C++
                    <input type="checkbox" id="py" value="py">Python
                    <input type="checkbox" id="cs" value="cs">C#
                    <input type="checkbox" id="sql" value="sql">SQL
                </div>
            
            <button class="btn btn-primary">Envoyer</button>
            </div>
        </form>

        <table>
            <thead>
                <tr>
                    <th>Nom</th>
                    <th>Prenom</th>
                    <th>Age</th>
                    <th>Filier</th>
                    <th>Ecole</th>
                    <th>Languages</th>
                    <th>Competences</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="tbody">
                <!-- Data row -->
            </tbody>
        </table>
    </div>

    <script type="text/JAVASCRIPT">
        const saveLogs=()=>{
            localStorage.setItem("logs",JSON.stringify(logs));
        };

        let logs=JSON.parse(localStorage.getItem("logs")) || [];

        const validation=()=>{
            const nom=$("#nom").val().trim();
            const prenom=$("#prenom").val().trim();
            const age=$("#age").val();
            const filier=("#filier").val();
            const ecole=$("input[name='ecole']:checked");
            const languages=$("select[name='langs[]']").val();

            const regN=/^[A-Za-z\s]+$/;
            if (!nom || !prenom || !age || !filier || !ecole || !languages){
                alert("tous les champs sont obligatoires!");
                return false;
            }
            if (!reg.test(nom) || !reg.test(prenom)){
                alert("nom et/ou prenom invalide");
                return false;
            }

            return true;
        }

        const display=()=>{
            logs.foreach((item,i)=>{
                $("#tBody").append(`
                <tr>
                    <td>${item.nom}</td>
                    <td>${item.prenom}</td>
                    <td>${item.age}</td>
                    <td>${item.filier}</td>
                    <td>${item.ecole}</td>
                    <td>${item.languages}</td>
                    <td>
                        <button class="btn btn-warning" onclick="edit(${i})">editer</button>
                        <button class="btn btn-danger" onclick="del(${i})">supprimer</button>
                    </td>
                </tr>
                `)
            })
        }

        const del=(i)=>{
            if (confirm("Supprimer cette inscription ?")){
                logs.splice(i,1);
                saveLogs();
                display();
            }
        }

        const edit=(i)=>{
            let ins=logs[i];
            $("#nom").val(ins.nom);
            $("#prenom").val(ins.prenom);
            $("#age").val(ins.age);
            $("#filier").val(ins.filier);
            $("[name=ecole]").prop("checked",false);
            $(`[name=ecole][value='${ins.ecole}']`).prop("chekced",true)
        }

    </script>
</body>
</html>
