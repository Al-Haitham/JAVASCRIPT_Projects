<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gestion Rendez-vous</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="p-4 bg-light">
    <div class="container">
        <h3 class="mb-4">Gestion des Rendez-vous Médicaux</h3>

        <!-- Formulaire -->
        <div class="row g-3 mb-4">
            <input class="form-control" type="text" id="nameR" placeholder="Nom complet">
            <input class="form-control" type="tel" id="gameName" placeholder="Téléphone">
            <input class="form-control" type="date" id="dateR">
            
            <select name="game" id="gameSelect" class="form-select">
                <option value="" selected disabled>Choisir une spécialité</option>
                <option value="Médecin généraliste">Médecin généraliste</option>
                <option value="Dentiste">Dentiste</option>
                <option value="Cardiologue">Cardiologue</option>
                <option value="Dermatologue">Dermatologue</option>
                <option value="Ophtalmologue">Ophtalmologue</option>
            </select>

            <button type="button" class="btn btn-success" onclick="saveP()" id="btnSave">Ajouter</button>
        </div>

        <!-- Recherche & Filtres -->
        <div class="searchFilter mb-3">
            <input type="text" onkeyup="renderBoard()" id="search" class="form-control w-50" placeholder="Rechercher...">
        </div>
        <button class="btn btn-danger mb-3" onclick="deleteSelected()">Supprimer la sélection</button>
        <!-- Tableau -->
        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>Sélectionner</th>
                    <th>Nom</th>
                    <th>Téléphone</th>
                    <th>Date</th>
                    <th>Spécialité</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="playerBoard"></tbody>
        </table>
    </div>

    <script>
        // Données initiales (spécialités JSON)
        const specialites = [
            { "id": 1, "nom": "Médecin généraliste" },
            { "id": 2, "nom": "Dentiste" },
            { "id": 3, "nom": "Cardiologue" },
            { "id": 4, "nom": "Dermatologue" },
            { "id": 5, "nom": "Ophtalmologue" }
        ];

        // Classes
        class RendezVous {
            constructor(nom, telephone, date, specialite) {
                this.nom = nom;
                this.telephone = telephone;
                this.date = date;
                this.specialite = specialite;
            }

            estValide = () => {
                if (!this.nom || !this.telephone || !this.date || !this.specialite) return false;
                if (this.telephone.length < 8) return false;
                const today = new Date().toISOString().split('T');
                if (this.date < today) return false;
                return true;
            }

            toHTMLRow = (index) => {
                return `<tr>
                    <td><input type="checkbox" class="row-checkbox" data-index="${index}"></td>
                    <td>${this.nom}</td>
                    <td>${this.telephone}</td>
                    <td>${this.date}</td>
                    <td>${this.specialite}</td>
                    <td>
                        <button class="btn btn-sm btn-warning" onclick="edit(${index})">Modifier</button>
                        <button class="btn btn-sm btn-danger" onclick="del(${index})">Supprimer</button>
                    </td>
                </tr>`;
            }
        }

        // Variables globales
        let rendezVousList = [];
        let editIndex = null;

        // Initialisation
        $(document).ready(() => {
            // Charger depuis localStorage
            let saved = localStorage.getItem("rendezVous");
            if (saved) {
                rendezVousList = JSON.parse(saved);
                renderBoard();
            }
        });

        // Sauvegarder dans localStorage
        const saveToStorage = () => {
            localStorage.setItem("rendezVous", JSON.stringify(rendezVousList));
        };

        // Sauvegarder (Add/Edit)
        const saveP = () => {
            const nom = $("#nameR").val().trim();
            const telephone = $("#gameName").val().trim();
            const date = $("#dateR").val();
            const specialite = $("#gameSelect").val();

            // Validation
            if (!nom || !telephone || !date || !specialite) {
                alert("Veuillez remplir tous les champs !");
                return;
            }

            if (telephone.length < 8) {
                alert("Le téléphone doit contenir au moins 8 chiffres !");
                return;
            }

            const today = new Date().toISOString().split('T');
            if (date < today) {
                alert("La date doit être égale ou postérieure à aujourd'hui !");
                return;
            }

            const rdv = new RendezVous(nom, telephone, date, specialite);

            // Mode Ajout vs Édition
            if (editIndex === null) {
                rendezVousList.push(rdv);
            } else {
                rendezVousList[editIndex] = rdv;
                editIndex = null;
            }

            clearForm();
            saveToStorage();
            renderBoard();
        };

        // Afficher le tableau (avec filtre)
        const renderBoard = () => {
            const search = $("#search").val().trim().toLowerCase();
            const $board = $("#playerBoard");
            $board.empty();

            let filteredBoard = rendezVousList;

            // Filtre de recherche
            if (search) {
                filteredBoard = filteredBoard.filter(r =>
                    r.nom.toLowerCase().includes(search) ||
                    r.specialite.toLowerCase().includes(search)
                );
            }

            // Afficher
            filteredBoard.forEach((rdv, index) => {
                $board.append(rdv.toHTMLRow(index));
            });
        };

        // Supprimer
        const deleteSelected = () => {
            const selected = [];
            $('.row-checkbox:checked').each(function() {
                selected.push($(this).data('index'));
            });

            if (selected.length === 0) {
                alert('Veuillez sélectionner au moins une ligne.');
                return;
            }

            if (confirm(`Supprimer ${selected.length} rendez-vous sélectionné(s) ?`)) {
                // Sort descending to avoid index shifting
                selected.sort((a, b) => b - a);
                selected.forEach(idx => rendezVousList.splice(idx, 1));
                saveToStorage();
                renderBoard();
            }
        };
        const del = (index) => {
            if (confirm("Supprimer ce rendez-vous ?")) {
                rendezVousList.splice(index, 1);
                saveToStorage();
                renderBoard();
            }
        };

        // Éditer
        const edit = (index) => {
            const rdv = rendezVousList[index];
            $("#nameR").val(rdv.nom);
            $("#gameName").val(rdv.telephone);
            $("#dateR").val(rdv.date);
            $("#gameSelect").val(rdv.specialite);
            editIndex = index;
        };

        // Vider le formulaire
        const clearForm = () => {
            $("#nameR").val("");
            $("#gameName").val("");
            $("#dateR").val("");
            $("#gameSelect").val("");
            editIndex = null;
        };
    </script>
</body>
</html>
